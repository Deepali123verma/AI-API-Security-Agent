openapi: 3.0.3
info:
  title: Auth Global API
  version: 1.0.0

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

security:
  - bearerAuth: []

paths:
  /users:
    get:
      summary: List users
      responses:
        '200':
          description: OK

  /users/{id}:
    get:
      summary: Get user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
