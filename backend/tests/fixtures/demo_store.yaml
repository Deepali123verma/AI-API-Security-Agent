openapi: 3.0.3
info:
  title: Demo Store API
  version: 1.0.0

paths:
  /users:
    get:
      summary: List users
      responses:
        '200':
          description: Successful response

  /users/{id}:
    get:
      summary: Get user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Successful response

  /login:
    post:
      summary: Login
      responses:
        '200':
          description: Successful login
