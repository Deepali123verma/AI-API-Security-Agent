openapi: 3.0.3
info:
  title: Multi Method API
  version: 1.0.0

paths:
  /items:
    get:
      summary: List items
      responses:
        '200':
          description: OK
    post:
      summary: Create item
      responses:
        '201':
          description: Created
    put:
      summary: Replace items
      responses:
        '200':
          description: OK
    patch:
      summary: Update items
      responses:
        '200':
          description: OK
    delete:
      summary: Delete items
      responses:
        '204':
          description: No Content
