# Local full-stack style stack (optional).
# Production on Railway uses the root Dockerfile + managed PostgreSQL instead.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: security_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d security_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

  # API-only image (backend/Dockerfile) — useful for local API development.
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/security_agent
      JWT_SECRET_KEY: change-this-in-production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      CORS_ORIGINS: http://localhost:5173,http://localhost:8000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_TEMPERATURE: ${GEMINI_TEMPERATURE:-0.2}
    depends_on:
      db:
        condition: service_healthy

  # Full production-style image: FastAPI serves the built React SPA on one port.
  web:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["fullstack"]
    ports:
      - "8080:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/security_agent
      JWT_SECRET_KEY: change-this-in-production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      CORS_ORIGINS: http://localhost:8080
      STATIC_DIR: /app/static
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_TEMPERATURE: ${GEMINI_TEMPERATURE:-0.2}
      PORT: 8000
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
